<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#8aaa5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grocery List">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Grocery Checklist</title>

<style>
:root{
  --matcha:#8aaa5b;
  --dark:#4f6733;
  --soft:#edf4df;
  --cream:#fbfcf5;
  --text:#30392a;
  --muted:#7d876f;
  --line:#dbe5ca;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(
    180deg,
    #edf4df,
    #f8faf2 45%,
    #fff
  );
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
  color:var(--text);
  min-height:100vh;
}

.app{
  max-width:760px;
  margin:auto;
  padding:
    max(22px,env(safe-area-inset-top))
    16px
    calc(30px + env(safe-area-inset-bottom));
}

/* HEADER */

header{
  text-align:center;
  padding:12px 5px 8px;
}

.logo{
  font-size:42px;
}

h1{
  margin:2px 0 4px;
  font-size:30px;
  letter-spacing:-.7px;
  color:var(--dark);
}

.subtitle{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

/* TABS */

.tabs{
  display:flex;
  gap:6px;
  background:#ffffffc9;
  border:1px solid var(--line);
  padding:5px;
  border-radius:16px;
  margin:14px 0;
}

.tab{
  flex:1;
  border:0;
  border-radius:11px;
  padding:11px 8px;
  background:transparent;
  color:var(--muted);
  font-weight:700;
  font-size:14px;
}

.tab.active{
  background:var(--matcha);
  color:white;
}

/* ADD BAR */

.add{
  display:flex;
  gap:8px;
  background:#fff;
  padding:9px;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 7px 25px #526b3212;
}

input[type=text]{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:var(--cream);
  border-radius:12px;
  padding:13px;
  font-size:16px;
  color:var(--text);
}

select{
  border:1px solid var(--line);
  background:var(--cream);
  border-radius:12px;
  padding:0 10px;
  color:var(--dark);
  font-size:14px;
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
}

#addBtn{
  background:var(--matcha);
  color:white;
  border-radius:12px;
  padding:0 18px;
  font-weight:700;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:15px 2px 10px;
  gap:8px;
}

#count{
  font-size:13px;
  color:var(--muted);
}

.actions{
  display:flex;
  gap:6px;
}

.small{
  background:#fff;
  border:1px solid var(--line);
  color:var(--dark);
  border-radius:10px;
  padding:7px 9px;
  font-size:12px;
  font-weight:600;
}

/* TODAY HEADER */

.today-banner{
  background:var(--soft);
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 13px;
  margin-bottom:14px;
  text-align:center;
  color:var(--dark);
  font-size:13px;
}

.today-banner strong{
  display:block;
  font-size:16px;
  margin-bottom:2px;
}

/* CATEGORIES */

.category{
  margin:16px 0 8px;
  color:var(--dark);
  font-weight:800;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:7px;
}

/* ITEMS */

.item{
  display:flex;
  align-items:center;
  gap:11px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 10px;
  margin-bottom:7px;
}

.check{
  appearance:none;
  width:23px;
  height:23px;
  flex:0 0 23px;
  border:2px solid #b7c59e;
  border-radius:7px;
  background:white;
  position:relative;
}

.check:checked{
  background:var(--matcha);
  border-color:var(--matcha);
}

.check:checked:after{
  content:"✓";
  position:absolute;
  color:#fff;
  font-weight:800;
  left:3px;
  top:-2px;
}

.name{
  flex:1;
  overflow-wrap:anywhere;
  font-size:15px;
}

.done .name{
  text-decoration:line-through;
  color:#a3aa99;
}

/* BUTTONS */

.delete,
.copy{
  width:32px;
  height:32px;
  border-radius:9px;
  flex:0 0 32px;
}

.delete{
  background:#f5f8ed;
  color:#74864f;
  font-size:18px;
}

.copy{
  background:#edf4df;
  color:var(--dark);
  font-size:18px;
  font-weight:700;
}

.copy:hover{
  background:#dfeacb;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:42px 15px;
  color:var(--muted);
  background:#ffffffb8;
  border:1px dashed var(--line);
  border-radius:16px;
}

/* FOOTER */

footer{
  text-align:center;
  color:#9aa58b;
  font-size:11px;
  margin-top:20px;
}

/* MOBILE */

@media(max-width:560px){

  .add{
    flex-wrap:wrap;
  }

  .add input{
    width:100%;
    flex-basis:100%;
  }

  .add select{
    height:43px;
    flex:1;
  }

  .add #addBtn{
    height:43px;
  }

  .toolbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .small{
    flex:1;
  }
}
</style>
</head>

<body>

<main class="app">

<header>
  <div class="logo">🌿</div>

  <h1>Grocery Checklist</h1>

  <div class="subtitle" id="dateSubtitle"></div>
</header>


<!-- LIST SWITCHER -->

<div class="tabs">

  <button
    class="tab active"
    id="masterTab"
    type="button">
    🛒 Master List
  </button>

  <button
    class="tab"
    id="todayTab"
    type="button">
    🌿 Today
  </button>

</div>


<!-- ADD ITEM -->

<section class="add">

  <input
    id="input"
    type="text"
    placeholder="Add a grocery item..."
    autocomplete="off">

  <select id="category"></select>

  <button
    id="addBtn"
    type="button">
    + Add
  </button>

</section>


<!-- TOOLBAR -->

<div class="toolbar">

  <span id="count"></span>

  <div class="actions">

    <button
      class="small"
      id="clearChecked"
      type="button">
      Clear checked
    </button>

    <button
      class="small"
      id="clearAll"
      type="button">
      Reset list
    </button>

  </div>

</div>


<!-- LIST -->

<section id="list"></section>


<footer>
  Saved automatically • Works offline • Your lists stay on this device
</footer>

</main>


<script>

/* =========================================
   DATE
========================================= */

function dateKeyFor(date){

  const yyyy = date.getFullYear();

  const mm =
    String(date.getMonth() + 1)
      .padStart(2,"0");

  const dd =
    String(date.getDate())
      .padStart(2,"0");

  return `${yyyy}-${mm}-${dd}`;

}

const today = new Date();

const DATE_KEY = dateKeyFor(today);


/* =========================================
   STORAGE KEYS
========================================= */

const MASTER_KEY =
  "matcha-grocery-master-v2";

const TODAY_KEY =
  `matcha-grocery-today-v2-${DATE_KEY}`;


/*
  OLD KEY FROM YOUR ORIGINAL APP.

  This lets the new version recover
  your previous list if it still exists.
*/

const OLD_KEY =
  `matcha-grocery-list-v1-${DATE_KEY}`;


/* =========================================
   CATEGORIES
========================================= */

const categories = [

  "Cat & Pet",

  "Household",

  "Pantry",

  "Dairy & Refrigerated",

  "Personal Care",

  "Frozen & Refrigerated",

  "Pasta & Grains",

  "Produce",

  "Dairy (additional)",

  "Personal Care (additional)",

  "Bakery",

  "Proteins",

  "Condiments & Sauces",

  "Beverages",

  "Health & Wellness",

  "Cleaning & Laundry"

];


/* =========================================
   YOUR PERMANENT MASTER LIST
========================================= */

const originalMaster = [

  ["Cat & Pet","Wet cat food (pate variety)"],
  ["Cat & Pet","Dry cat food"],
  ["Cat & Pet","Cat litter (non-clumping, 25 lb)"],
  ["Cat & Pet","Cat treats"],

  ["Household","Paper towels"],
  ["Household","Paper plates"],
  ["Household","Nasal spray decongestant"],
  ["Household","Hydrogen peroxide"],

  ["Pantry","Pasta sauce"],
  ["Pantry","Ground beef (organic, grass-fed)"],
  ["Pantry","Frozen blueberries"],
  ["Pantry","Flour tortillas"],
  ["Pantry","Taco seasoning"],
  ["Pantry","Hemp hearts"],
  ["Pantry","Bolillo rolls"],

  ["Dairy & Refrigerated","Whole milk"],
  ["Dairy & Refrigerated","Eggs"],
  ["Dairy & Refrigerated","Orange juice"],

  ["Personal Care","Cotton swabs"],
  ["Personal Care","Dental floss"],

  ["Frozen & Refrigerated","Frozen pie crusts"],
  ["Frozen & Refrigerated","Frozen burritos / chimichangas"],
  ["Frozen & Refrigerated","Beef burgers (frozen patties)"],
  ["Frozen & Refrigerated","Potato salad (ready-to-serve)"],

  ["Pasta & Grains","Spaghetti / lasagna pasta"],
  ["Pasta & Grains","Ramen / instant noodles"],
  ["Pasta & Grains","Basmati rice"],

  ["Produce","Avocados"],
  ["Produce","Roma tomatoes"],
  ["Produce","Kiwi fruit"],
  ["Produce","Carrots"],

  ["Dairy (additional)","Yogurt (Greek, whole milk)"],
  ["Dairy (additional)","Butter"],
  ["Dairy (additional)","Ricotta & mozzarella cheese"],
  ["Dairy (additional)","Sour cream"],

  ["Personal Care (additional)","Bar soap"],
  ["Personal Care (additional)","Deodorant"],
  ["Personal Care (additional)","Shampoo"],
  ["Personal Care (additional)","Pore strips / acne patches"],

  ["Bakery","Bread loaf"],
  ["Bakery","Burger buns"],
  ["Bakery","Muffins"],

  ["Proteins","Sausage / hot links"],
  ["Proteins","Bacon"],
  ["Proteins","Canned tuna / trout"],

  ["Condiments & Sauces","Ketchup"],
  ["Condiments & Sauces","Mayonnaise"],
  ["Condiments & Sauces","Salsa"],
  ["Condiments & Sauces","Soy sauce"],

  ["Beverages","Apple juice"],
  ["Beverages","Coconut water"],
  ["Beverages","Coffee (ground)"],

  ["Health & Wellness","Protein shakes"],
  ["Health & Wellness","Granola"],
  ["Health & Wellness","Flax seed"],
  ["Health & Wellness","Sweetener (zero calorie)"],

  ["Cleaning & Laundry","Laundry detergent"],
  ["Cleaning & Laundry","Dish soap"]

];


/* =========================================
   DOM
========================================= */

const input =
  document.getElementById("input");

const category =
  document.getElementById("category");

const list =
  document.getElementById("list");

const count =
  document.getElementById("count");

const masterTab =
  document.getElementById("masterTab");

const todayTab =
  document.getElementById("todayTab");

const dateSubtitle =
  document.getElementById("dateSubtitle");


/* =========================================
   CATEGORY DROPDOWN
========================================= */

categories.forEach(catName => {

  category.add(
    new Option(catName,catName)
  );

});


/* =========================================
   SAFE LOAD
========================================= */

function loadJSON(key){

  try{

    const saved =
      localStorage.getItem(key);

    if(!saved) return null;

    const parsed =
      JSON.parse(saved);

    return Array.isArray(parsed)
      ? parsed
      : null;

  }catch(error){

    return null;

  }

}


/* =========================================
   MASTER LIST
========================================= */

let masterItems =
  loadJSON(MASTER_KEY);


/*
  If the new Master List doesn't exist,
  check the old version.

  This prevents your previous list
  from being lost.
*/

if(!masterItems){

  const oldItems =
    loadJSON(OLD_KEY);

  if(oldItems){

    masterItems =
      oldItems.map(item => ({

        name:item.name,

        category:
          categories.includes(item.category)
            ? item.category
            : "Household",

        done:false

      }));

  }else{

    masterItems =
      originalMaster.map(([category,name]) => ({

        category,

        name,

        done:false

      }));

  }

}


/* =========================================
   TODAY LIST
========================================= */

let todayItems =
  loadJSON(TODAY_KEY);

if(!todayItems){

  todayItems = [];

}


/* =========================================
   CURRENT LIST
========================================= */

let currentList = "master";


/* =========================================
   SAVE
========================================= */

function save(){

  localStorage.setItem(
    MASTER_KEY,
    JSON.stringify(masterItems)
  );

  localStorage.setItem(
    TODAY_KEY,
    JSON.stringify(todayItems)
  );

}


/* =========================================
   INITIAL SAVE
========================================= */

save();


/* =========================================
   HEADER DATE
========================================= */

dateSubtitle.textContent =
  `Today: ${DATE_KEY}`;


/* =========================================
   SWITCH LIST
========================================= */

function switchList(type){

  currentList = type;

  if(type === "master"){

    masterTab.classList.add("active");

    todayTab.classList.remove("active");

    input.placeholder =
      "Add a grocery item to your Master List...";

  }else{

    todayTab.classList.add("active");

    masterTab.classList.remove("active");

    input.placeholder =
      "Add a grocery item for today...";

  }

  render();

}


masterTab.onclick = () =>
  switchList("master");


todayTab.onclick = () =>
  switchList("today");


/* =========================================
   RENDER
========================================= */

function render(){

  list.innerHTML = "";

  const items =
    currentList === "master"
      ? masterItems
      : todayItems;


  /* TODAY BANNER */

  if(currentList === "today"){

    const banner =
      document.createElement("div");

    banner.className =
      "today-banner";

    banner.innerHTML = `
      <strong>🌿 Today's Grocery List</strong>
      ${DATE_KEY}<br>
      Add items here, cross them off, or copy them from your Master List.
    `;

    list.appendChild(banner);

  }


  /* EMPTY */

  if(!items.length){

    const empty =
      document.createElement("div");

    empty.className = "empty";

    if(currentList === "master"){

      empty.innerHTML = `
        <b>Your Master Grocery List is empty 🌿</b><br>
        Add your regular grocery items above.
      `;

    }else{

      empty.innerHTML = `
        <b>Today's list is empty 🌿</b><br>
        Add items above or use ＋ from your Master List.
      `;

    }

    list.appendChild(empty);

  }


  /* CATEGORIES */

  categories.forEach(categoryName => {

    const group =
      items.filter(
        item =>
          item.category === categoryName
      );

    if(!group.length) return;


    const title =
      document.createElement("div");

    title.className =
      "category";

    title.textContent =
      categoryName;

    list.appendChild(title);


    /* ITEMS */

    group.forEach(item => {

      const index =
        items.indexOf(item);

      const row =
        document.createElement("div");

      row.className =
        "item" +
        (item.done ? " done" : "");


      /* CHECKBOX */

      const check =
        document.createElement("input");

      check.type =
        "checkbox";

      check.className =
        "check";

      check.checked =
        item.done;


      check.addEventListener(
        "change",
        () => {

          item.done =
            check.checked;

          save();

          render();

        }
      );


      /* NAME */

      const name =
        document.createElement("span");

      name.className =
        "name";

      name.textContent =
        item.name;


      name.addEventListener(
        "click",
        () => {

          item.done =
            !item.done;

          save();

          render();

        }
      );


      row.appendChild(check);

      row.appendChild(name);


      /* MASTER → TODAY BUTTON */

      if(currentList === "master"){

        const copy =
          document.createElement("button");

        copy.className =
          "copy";

        copy.textContent =
          "＋";

        copy.title =
          "Add to Today's List";

        copy.setAttribute(
          "aria-label",
          "Add " + item.name +
          " to today's list"
        );


        copy.onclick = () => {

          const alreadyExists =
            todayItems.some(
              todayItem =>
                todayItem.name.toLowerCase() ===
                item.name.toLowerCase() &&
                todayItem.category ===
                item.category
            );


          if(alreadyExists){

            alert(
              `"${item.name}" is already on today's list.`
            );

            return;

          }


          todayItems.push({

            name:item.name,

            category:item.category,

            done:false

          });


          save();


          copy.textContent = "✓";

          setTimeout(
            () => {
              copy.textContent = "＋";
            },
            900
          );

        };


        row.appendChild(copy);

      }


      /* DELETE */

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "×";

      deleteButton.title =
        "Delete item";

      deleteButton.setAttribute(
        "aria-label",
        "Delete " + item.name
      );


      deleteButton.onclick = () => {

        const message =
          currentList === "master"

            ? `Delete "${item.name}" from your Master List?`

            : `Remove "${item.name}" from today's list?`;


        if(!confirm(message))
          return;


        items.splice(index,1);

        save();

        render();

      };


      row.appendChild(deleteButton);

      list.appendChild(row);

    });

  });


  /* COUNT */

  const remaining =
    items.filter(
      item => !item.done
    ).length;

  count.textContent =
    `${remaining} remaining • ${items.length} total`;

}


/* =========================================
   ADD ITEM
========================================= */

function addItem(){

  const name =
    input.value.trim();

  if(!name) return;


  const categoryName =
    category.value;


  const newItem = {

    name,

    category:
      categories.includes(categoryName)
        ? categoryName
        : categories[0],

    done:false

  };


  if(currentList === "master"){

    masterItems.push(newItem);

  }else{

    todayItems.push(newItem);

  }


  save();

  input.value = "";

  render();

  input.focus();

}


document.getElementById("addBtn")
  .onclick = addItem;


input.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      addItem();

    }

  }
);


/* =========================================
   CLEAR CHECKED
========================================= */

document.getElementById(
  "clearChecked"
).onclick = () => {

  if(currentList === "master"){

    masterItems =
      masterItems.filter(
        item => !item.done
      );

  }else{

    todayItems =
      todayItems.filter(
        item => !item.done
      );

  }


  save();

  render();

};


/* =========================================
   RESET CURRENT LIST
========================================= */

document.getElementById(
  "clearAll"
).onclick = () => {


  if(currentList === "master"){

    if(!masterItems.length)
      return;


    if(
      !confirm(
        "Reset your Master Grocery List back to the original grocery list?"
      )
    ){

      return;

    }


    masterItems =
      originalMaster.map(
        ([category,name]) => ({

          category,

          name,

          done:false

        })
      );


  }else{

    if(!todayItems.length)
      return;


    if(
      !confirm(
        "Reset Today's Grocery List? This will only clear today's list."
      )
    ){

      return;

    }


    todayItems = [];

  }


  save();

  render();

};


/* =========================================
   SERVICE WORKER
========================================= */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker.register(
        "service-worker.js"
      );

    }
  );

}


/* =========================================
   START
========================================= */

render();

</script>

</body>
</html>
